<body>

<div id="site-header"></div>

<main class="section container">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="/">Home</a><span>/</span>
        <a href="/cart/">Cart</a><span>/</span>
        <span>Checkout</span>
    </nav>
    <h1 style="margin-bottom: var(--space-lg);">Checkout</h1>

    <div class="checkout-layout">
        <div>
            <h2 style="font-size: 1.15rem; margin-bottom: var(--space-md);">Delivery Information</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="whatsapp">WhatsApp Number *</label>
                        <input type="tel" id="whatsapp" name="whatsapp" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email (Optional)</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="address">Complete Address *</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City *</label>
                        <input type="text" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="area">Area *</label>
                        <input type="text" id="area" name="area" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="postal">Postal Code (Optional)</label>
                    <input type="text" id="postal" name="postal">
                </div>

                <h2 style="font-size: 1.15rem; margin: var(--space-lg) 0 var(--space-md);">Payment Method</h2>
                <div class="payment-options">
                    <div class="payment-option selected">Cash on Delivery</div>
                </div>

                <div class="form-group" style="margin-top: var(--space-md);">
                    <label for="notes">Order Notes (Optional)</label>
                    <textarea id="notes" name="notes" rows="4"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: var(--space-sm);">Place Order via WhatsApp</button>
                <p class="form-hint" style="text-align:center; margin-top: var(--space-sm);">You will be redirected to WhatsApp to confirm your order with us.</p>
            </form>
        </div>

        <div class="summary-card" style="position: sticky; top: calc(var(--header-height) + var(--space-md));">
            <h3 style="margin-bottom: var(--space-lg);">Order Summary</h3>
            <div id="checkout-items"></div>
            <div style="margin-top: var(--space-lg);">
                <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">Rs. 0</span></div>
                <div class="summary-row"><span>Delivery</span><span id="summary-delivery">Rs. 0</span></div>
                <div class="summary-row summary-total"><span>Total</span><span id="summary-total">Rs. 0</span></div>
            </div>
        </div>
    </div>
</main>

<div id="site-footer"></div>

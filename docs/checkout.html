<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - 9EXO</title>
    <meta name="description" content="Complete your order at 9EXO. Orders are confirmed over WhatsApp with cash on delivery, bank transfer, EasyPaisa or JazzCash.">
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0a09">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="section container">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="/">Home</a><span>/</span>
        <a href="/cart.html">Cart</a><span>/</span>
        <span>Checkout</span>
    </nav>
    <h1 style="margin-bottom: var(--space-lg);">Checkout</h1>

    <div class="checkout-layout">
        <div>
            <h2 style="font-size: 1.15rem; margin-bottom: var(--space-md);">Delivery Information</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="whatsapp">WhatsApp Number *</label>
                        <input type="tel" id="whatsapp" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email (Optional)</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label for="address">Complete Address *</label>
                    <input type="text" id="address" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City *</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label for="area">Area *</label>
                        <input type="text" id="area" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="postal">Postal Code (Optional)</label>
                    <input type="text" id="postal">
                </div>

                <h2 style="font-size: 1.15rem; margin: var(--space-lg) 0 var(--space-md);">Payment Method</h2>
                <div class="payment-options" id="payment-options">
                    <label class="payment-option selected">
                        <input type="radio" name="payment" value="Cash on Delivery" checked>
                        Cash on Delivery
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment" value="Bank Transfer">
                        Bank Transfer
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment" value="EasyPaisa">
                        EasyPaisa
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment" value="JazzCash">
                        JazzCash
                    </label>
                </div>

                <div class="form-group" style="margin-top: var(--space-md);">
                    <label for="notes">Order Notes (Optional)</label>
                    <textarea id="notes" rows="4"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: var(--space-sm);">Place Order via WhatsApp</button>
                <p class="form-hint" style="text-align:center; margin-top: var(--space-sm);">You will be redirected to WhatsApp to confirm your order with us.</p>
            </form>
        </div>

        <div class="summary-card" style="position: sticky; top: calc(var(--header-height) + var(--space-md));">
            <h3 style="margin-bottom: var(--space-lg);">Order Summary</h3>
            <div id="checkout-items"></div>
            <div style="margin-top: var(--space-lg);">
                <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">Rs. 0</span></div>
                <div class="summary-row"><span>Delivery</span><span id="summary-delivery">Rs. 0</span></div>
                <div class="summary-row summary-total"><span>Total</span><span id="summary-total">Rs. 0</span></div>
            </div>
        </div>
    </div>
</main>

<div id="site-footer"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/icons.js"></script>
<script src="/assets/js/partials.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/checkout.js"></script>
</body>
</html>

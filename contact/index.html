<body>

<div id="site-header"></div>

<main class="section container">
    <div class="page-header" style="padding-top:0;">
        <span class="eyebrow">Get In Touch</span>
        <h1>Contact Us</h1>
        <p style="color: var(--color-grey-600); max-width: 520px; margin: 0 auto;">Questions about an order, sizing, or a product? Reach out and our team will get back to you.</p>
    </div>

    <div class="contact-layout">
        <div>
            <div class="contact-info-card">
                <div class="icon-wrap">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M4 5c0 8.8 6.2 15 15 15l3-4-6-3-2 2c-2.5-1.2-4.8-3.5-6-6l2-2-3-6z"></path></svg>
                </div>
                <div>
                    <h3>Phone</h3>
                    <p id="contact-phone"></p>
                </div>
            </div>
            <div class="contact-info-card">
                <div class="icon-wrap">
                    <svg class="icon" viewBox="0 0 24 24" fill="#25D366" stroke="none"><path d="M17.5 14.4c-.3-.1-1.6-.8-1.9-.9-.3-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.2-.4.1-.2 0-.3 0-.5-.1-.1-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.9-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"></path><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2z"></path></svg>
                </div>
                <div>
                    <h3>WhatsApp</h3>
                    <p id="contact-whatsapp"></p>
                </div>
            </div>
            <div class="contact-info-card">
                <div class="icon-wrap">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="1"></rect><polyline points="2 6 12 13 22 6"></polyline></svg>
                </div>
                <div>
                    <h3>Email</h3>
                    <p id="contact-email"></p>
                </div>
            </div>
            <div class="contact-info-card">
                <div class="icon-wrap">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </div>
                <div>
                    <h3>Address</h3>
                    <p id="contact-address"></p>
                </div>
            </div>
            <div class="contact-info-card">
                <div class="icon-wrap">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 16 14"></polyline></svg>
                </div>
                <div>
                    <h3>Business Hours</h3>
                    <p id="contact-hours"></p>
                </div>
            </div>
        </div>

        <div>
            <h2 style="font-size: 1.15rem; margin-bottom: var(--space-md);">Send Us a Message</h2>
            <form id="contact-form">
                <div class="form-group">
                    <label for="c-name">Full Name *</label>
                    <input type="text" id="c-name" required>
                </div>
                <div class="form-group">
                    <label for="c-phone">Phone Number *</label>
                    <input type="tel" id="c-phone" required>
                </div>
                <div class="form-group">
                    <label for="c-subject">Subject</label>
                    <input type="text" id="c-subject" placeholder="Order query, sizing, general question...">
                </div>
                <div class="form-group">
                    <label for="c-message">Message *</label>
                    <textarea id="c-message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send via WhatsApp</button>
                <p class="form-hint" style="text-align:center; margin-top: var(--space-sm);">This opens WhatsApp with your message pre-filled, ready to send.</p>
            </form>
        </div>
    </div>
</main>

<div id="site-footer"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/icons.js"></script>
<script src="/assets/js/partials.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/cart-drawer.js"></script>
<script>
    const c = window.CONFIG.contact;
    document.getElementById('contact-phone').textContent = c.phone;
    document.getElementById('contact-whatsapp').textContent = c.whatsapp;
    document.getElementById('contact-email').textContent = c.email;
    document.getElementById('contact-address').textContent = c.address;
    document.getElementById('contact-hours').textContent = c.businessHours;

    document.getElementById('contact-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('c-name').value;
        const phone = document.getElementById('c-phone').value;
        const subject = document.getElementById('c-subject').value || 'General Question';
        const message = document.getElementById('c-message').value;

        let text = `Contact Form Message\n\nName: ${name}\nPhone: ${phone}\nSubject: ${subject}\n\nMessage:\n${message}`;
        const targetWhatsapp = c.whatsapp.replace(/[^0-9]/g, '');
        window.open(`https://wa.me/${targetWhatsapp}?text=${encodeURIComponent(text)}`, '_blank');
    });
</script>
